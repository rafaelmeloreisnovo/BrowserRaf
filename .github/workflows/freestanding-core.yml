name: Freestanding core smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/check_host_freestanding.sh
  cross-abi-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/check_cross_abi_objects.sh
  negative-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/check_negative_fixtures.sh
